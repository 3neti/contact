name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            laravel: '^12.0'
            testbench: '^10.3'
            pest: '^3.8'
            hyperverge: '^1.1'
          - php: '8.4'
            laravel: '^12.0'
            testbench: '^10.3'
            pest: '^3.8'
            hyperverge: '^1.1'
          - php: '8.3'
            laravel: '^13.0'
            testbench: '^11.0'
            pest: '^4.0'
            hyperverge: '2.0.0-beta.1'
          - php: '8.4'
            laravel: '^13.0'
            testbench: '^11.0'
            pest: '^4.0'
            hyperverge: '2.0.0-beta.1'

    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: gd, sqlite3

      - name: Install matrix dependencies
        run: |
          composer require --dev \
            laravel/framework:${{ matrix.laravel }} \
            orchestra/testbench:${{ matrix.testbench }} \
            pestphp/pest:${{ matrix.pest }} \
            3neti/hyperverge:${{ matrix.hyperverge }} \
            --with-all-dependencies \
            --no-interaction \
            --no-progress

      - name: Validate package
        run: composer validate --strict --no-check-lock

      - name: Run tests
        run: composer test

      - name: Audit dependencies
        run: composer audit
